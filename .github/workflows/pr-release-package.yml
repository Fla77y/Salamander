name: Release portability packages (Windows 2026)

on:
  pull_request:
    branches: ["**"]
    paths:
      - "tools/release/**"
      - "src/safefile.cpp"
      - "src/fileswn0.cpp"
      - "src/common/win32_long_path.h"
      - ".github/workflows/pr-release-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package x64 Debug/Release; publish Release only
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install matching v143 ATL and Windows SDK UCRT components
        shell: pwsh
        run: |
          $installer = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\setup.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Visual Studio installer missing: $installer" }
          $vs = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise'
          $args = @(
            'modify', '--installPath', $vs,
            '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL',
            '--add', 'Microsoft.Component.VC.Runtime.UCRTSDK',
            '--quiet', '--norestart'
          )
          $arguments = ($args | ForEach-Object {
            if ($_ -eq $vs) { '"' + $_ + '"' } else { $_ }
          }) -join ' '
          # setup.exe does not accept --wait. Start-Process -Wait tracks the installer process.
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Visual Studio component installation failed: $($process.ExitCode)"
          }

      - name: Install Inno Setup and 7-Zip for packaging
        shell: pwsh
        run: |
          choco install innosetup 7zip --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey prerequisite installation failed: $LASTEXITCODE" }

      - name: Run parser and package regression tests
        shell: pwsh
        run: |
          ./tools/release/tests/Test-Package-Helpers.ps1
          ./tools/release/tests/Test-ReleasePublicArtifact.ps1

      - name: Rebuild Debug and Release, compile help and produce packages
        shell: pwsh
        run: ./tools/release/Update-Build-Test-Package.ps1 -SkipUpdate -BuildRoot (Join-Path $env:RUNNER_TEMP 'OpenSal')

      - name: Verify extracted portable Release payload
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'OpenSal\dist'
          $target = Join-Path $env:RUNNER_TEMP 'OpenSal\portable-check'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          & $sevenZip x '-y' "-o$target" (Join-Path $dist 'OpenSalamander-Release-x64.7z')
          if ($LASTEXITCODE -ne 0) { throw "Release extraction failed: $LASTEXITCODE" }
          ./tools/release/tests/Test-PortableManifest.ps1 -ExtractedDirectory $target

      - name: Verify redistributable Release SHA256 manifest
        shell: pwsh
        run: ./tools/release/tests/Test-ReleaseChecksumManifest.ps1 -DistributionDirectory (Join-Path $env:RUNNER_TEMP 'OpenSal\dist')

      - name: Smoke-test silent Release installer and uninstaller
        shell: pwsh
        run: ./tools/release/tests/Test-ReleaseInstaller.ps1 -InstallerPath (Join-Path $env:RUNNER_TEMP 'OpenSal\dist\OpenSalamander-Release-x64-Setup.exe')

      # Never expose Debug CRT DLLs via public workflow artifacts.
      # GUI automation requires an unlocked interactive desktop. GitHub-hosted
      # runners run as non-interactive services, so real UI tests are a
      # separate locally executed acceptance gate, not part of this package job.
      # Invoke .\\manage.cmd --test-gui-baseline, then --test-gui on Windows.

      - name: Stage and verify exact public Release files
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'OpenSal\dist'
          $public = Join-Path $env:RUNNER_TEMP 'OpenSal\public-release'
          New-Item -ItemType Directory -Force -Path $public | Out-Null
          foreach ($name in @('OpenSalamander-Release-x64.7z',
                               'OpenSalamander-Release-x64-Setup.exe',
                               'SHA256SUMS-Release.txt')) {
            Copy-Item -LiteralPath (Join-Path $dist $name) -Destination $public -ErrorAction Stop
          }
          ./tools/release/tests/Test-ReleaseChecksumManifest.ps1 -DistributionDirectory $public -RequirePublicOnly

      - name: Upload redistributable Release outputs only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSalamander-Release-x64
          path: |
            ${{ runner.temp }}\OpenSal\public-release\OpenSalamander-Release-x64.7z
            ${{ runner.temp }}\OpenSal\public-release\OpenSalamander-Release-x64-Setup.exe
            ${{ runner.temp }}\OpenSal\public-release\SHA256SUMS-Release.txt
          if-no-files-found: error
